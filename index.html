<style>
:root{--bg:#0d0307;--ink:#fde8ec;--mute:#d2a2b1;--acc:#ff2d6b;--acc2:#ff8a4c;--gold:#f3c677;--rose:#ff8fb0;--line:rgba(255,95,135,.26);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(900px 600px at 12% -8%,rgba(255,31,90,.30),transparent 62%),radial-gradient(800px 620px at 105% 108%,rgba(170,10,90,.38),transparent 60%),radial-gradient(520px 420px at 50% 55%,rgba(255,110,60,.09),transparent 70%),#0d0307}
.bg i{position:absolute;bottom:-14px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#ffd0a0,#ff2d6b 55%,transparent 72%);opacity:0;animation:ember var(--d) linear infinite;animation-delay:var(--l)}
@keyframes ember{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(var(--dx),-108vh);opacity:0}}
main{max-width:460px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:3.4rem;margin:.05em 0 .1em;font-style:italic;font-weight:400;letter-spacing:.02em;background:linear-gradient(90deg,#ffe0b0,#ff6a8a 45%,#ff1f5a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(255,45,107,.55))}
h2{font-size:1.5rem;margin:.2em 0 .5em;font-weight:400}
p{color:var(--mute);margin:.5em 0 1em}
.card{position:relative;background:linear-gradient(160deg,rgba(80,12,40,.62),rgba(26,5,15,.84));border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,170,195,.15)}
button,input{font:inherit}
button{background:linear-gradient(135deg,#ff2d6b,#c4124a 62%,#8f0b3a);color:#fff;border:0;border-radius:16px;padding:14px 18px;width:100%;margin:6px 0;cursor:pointer;letter-spacing:.03em;box-shadow:0 6px 22px rgba(255,31,90,.38),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s,box-shadow .2s}
button:active{transform:scale(.975);box-shadow:0 2px 10px rgba(255,31,90,.4)}
button:disabled{opacity:.42;filter:saturate(.4);box-shadow:none}
button.alt{background:rgba(255,255,255,.03);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.sm{width:auto;padding:8px 13px;font-size:.85rem}
input[type=text],input[type=time]{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:rgba(10,2,6,.55);color:var(--ink);margin:6px 0;outline:none}
input[type=text]:focus,input[type=time]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,45,107,.22)}
input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px;flex:none}
label{color:var(--mute);font-size:.85rem}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0;color:var(--ink)}
.bar{height:12px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden;margin:8px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a4c,#ff2d6b 60%,#d4128f);box-shadow:0 0 14px rgba(255,45,107,.85);transition:width .6s}
.m{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.m:first-child{border-top:0}.lock{opacity:.4}
.m.mini{justify-content:flex-start;align-items:center;gap:12px}
.tag{font-size:.74rem;color:var(--gold);letter-spacing:.22em;text-transform:uppercase}
.code{font-size:2.8rem;letter-spacing:.3em;text-align:center;margin:.2em 0;color:var(--gold);text-shadow:0 0 20px rgba(255,45,107,.75)}
.note{font-size:.8rem;color:var(--mute)}
.err{color:#ffb08a}

/* menù a schede */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hd h2{margin:0}.hd .sm{margin:0 0 4px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px -18px 8px;padding:8px 18px;background:rgba(13,3,7,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb{position:relative;width:100%;margin:0;padding:10px 2px;font-size:.8rem;letter-spacing:.01em;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);box-shadow:none;color:var(--mute)}
.tb.on{background:linear-gradient(135deg,#ff2d6b,#c4124a 62%,#8f0b3a);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(255,31,90,.38)}
.bdg{position:absolute;top:-6px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--gold);color:#2a030d;font-size:.7rem;line-height:18px;font-weight:700}

/* disegni */
.il{display:block;filter:drop-shadow(0 0 7px rgba(255,45,107,.55))}
.il path,.il circle,.il ellipse,.il rect{fill:none;stroke:var(--gold);stroke-width:var(--sw,2.6);stroke-linecap:round;stroke-linejoin:round}
.il .f{fill:rgba(255,45,107,.38);stroke:var(--rose)}
.il .g{fill:rgba(243,198,119,.28)}
.il .w{stroke:var(--rose)}
.il .t{fill:#ffe0b0;stroke:none}
.logo{width:54px;height:54px;--sw:3.4;margin:4px 0 0}
.mini .il{width:36px;height:36px;flex:none;--sw:5;filter:none}

/* domanda del questionario */
.qc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:16em}
.qc .il{width:116px;height:116px;--sw:2.8}
.qt{font-size:1.3rem;font-style:italic;color:#ffe9d2;line-height:1.35}
.rise{animation:rise .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* carta che si gira */
.tcard{position:relative;width:min(100%,280px);aspect-ratio:3/4.3;margin:16px auto;perspective:1200px;-webkit-perspective:1200px}
.tin{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.9,.3,1)}
.tcard.open .tin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 13px),repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 13px),radial-gradient(circle at 50% 38%,#c4124a,#5a0720 70%,#2a030d);border:1.5px solid rgba(243,198,119,.6);box-shadow:0 18px 46px rgba(255,31,90,.32),inset 0 0 0 6px rgba(13,3,7,.55),inset 0 0 0 7px rgba(243,198,119,.35)}
.back .il{width:58%;height:auto;--sw:2.2}
.bn{font-style:italic;letter-spacing:.5em;text-indent:.5em;color:var(--gold);margin-top:6px}
.front{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);background:radial-gradient(120% 90% at 50% 18%,#5e0f2e 0%,#2b0716 60%,#150309 100%);border:1.5px solid rgba(243,198,119,.6);box-shadow:0 18px 50px rgba(255,31,90,.3),inset 0 0 0 6px rgba(13,3,7,.9),inset 0 0 0 7px rgba(243,198,119,.35);padding:30px 22px 26px}
.front::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 38% at 50% 40%,rgba(255,45,107,.30),transparent 72%);pointer-events:none}
.front .il{width:60%;max-width:170px;height:auto;position:relative}
.ctext{position:relative;font-style:italic;font-size:1.18rem;text-align:center;line-height:1.3;color:#ffe9d2;margin-top:12px;padding:0 4px}
.cn{position:absolute;color:var(--acc);font-style:normal;font-size:1.05rem}
.cn.tl{top:15px;left:18px}.cn.br{bottom:15px;right:18px;transform:rotate(180deg)}
.ftag{position:absolute;top:17px;left:0;right:0;text-align:center;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.fk{position:absolute;bottom:17px;left:0;right:0;text-align:center;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.tcard.deal{animation:deal .5s ease-out both}
@keyframes deal{from{transform:translateY(70px) scale(.8) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}
.tcard.just{animation:pop 1.1s ease-in-out}
@keyframes pop{0%{transform:none}40%{transform:translateY(-16px) scale(1.05)}100%{transform:none}}
.tcard.just .front::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:glint 1s .55s ease-out forwards}
@keyframes glint{to{left:140%}}
.tcard.idle .back{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 18px 60px rgba(255,31,90,.6),inset 0 0 0 6px rgba(13,3,7,.55),inset 0 0 0 7px rgba(243,198,119,.5)}}
@media (prefers-reduced-motion:reduce){.bg i{display:none}.tin{transition-duration:.01s}.tcard.just,.tcard.deal,.rise,.tcard.idle .back{animation:none}}
</style>

(()=>{const b=document.getElementById('bg');if(!b||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))return;

  e.style.cssText='--s:'+z+'px;--x:'+(Math.random()*100)+'%;--d:'+(9+Math.random()*10)+'s;--l:-'+(Math.random()*14)+'s;--dx:'+((Math.random()-.5)*120)+'px';b.appendChild(e)}})();

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let pid=store.get('brace-pid');if(!pid){pid=(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)}));store.set('brace-pid',pid)}
let tab='m',code=store.get('brace-code'),hm=null,st=null,shared=null,qi=0,tmp={s:[],f:[]},skip=0,lastI=-1,lastMaybe=false,fresh=false,fx=false,err='',busy=false,sig='',timer=null;
// carte già pescate su questo telefono (restano memorizzate anche se ricarichi la pagina)
let drawn={s:[],f:[],last:''};
const dkey=c=>'brace-drawn-'+c;

// ---- musica di sottofondo (parte con la tensione condivisa) ----
const MP3_BASE='https://apenno75.github.io/Brace/MP3/';
const MP3_API='https://api.github.com/repos/apenno75/Brace/contents/MP3';
let conf={given:[],got:[]},confOk=false;
const APP_V=8;
// se sul telefono c'è una versione vecchia in cache, scarica quella nuova e ricarica (una volta per sessione)
(async()=>{try{const r=await fetch(location.href.split('#')[0].split('?')[0],{cache:'no-store'});const t=await r.text();const m=t.match(/const APP_V=(\d+)/);
 if(m&&+m[1]>APP_V&&!sessionStorage.getItem('brace-rl')){sessionStorage.setItem('brace-rl','1');if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}location.reload()}}catch(e){}})();
let mTracks=null,mAudio=null,mOn=false,mLast='',mWait=false;
const mMuted=()=>store.get('brace-mute')==='1';
async function mLoad(){
 if(mTracks)return mTracks;
 try{const c=JSON.parse(sessionStorage.getItem('brace-mp3')||'null');if(c&&c.length){mTracks=c;return c}}catch(e){}
 let names=[];
 try{const r=await fetch(MP3_API);if(r.ok){const j=await r.json();names=j.filter(f=>f.type==='file'&&/\.mp3$/i.test(f.name)).map(f=>f.name)}}catch(e){}
 if(!names.length){try{const r=await fetch(MP3_BASE+'playlist.json');if(r.ok){const j=await r.json();names=j.filter(n=>/\.mp3$/i.test(n))}}catch(e){}}
 mTracks=names;try{sessionStorage.setItem('brace-mp3',JSON.stringify(names))}catch(e){}
 return names}
async function mNext(){
 if(!mOn||mMuted())return;
 const t=await mLoad();if(!t.length)return;
 let c=t.filter(n=>n!==mLast);if(!c.length)c=t;
 mLast=c[Math.floor(Math.random()*c.length)];
 if(!mAudio){mAudio=new Audio();mAudio.preload='auto';mAudio.volume=.6;mAudio.onended=mNext;mAudio.onerror=()=>setTimeout(mNext,1500)}
 mAudio.src=MP3_BASE+encodeURIComponent(mLast);
 try{await mAudio.play()}catch(e){mArm()}}
// i browser (iOS soprattutto) bloccano l'audio senza un tocco: riprova al primo tocco
function mArm(){
 if(mWait)return;mWait=true;
 const go=()=>{['pointerdown','touchend','keydown'].forEach(ev=>document.removeEventListener(ev,go,true));mWait=false;
  if(mOn&&!mMuted()){if(mAudio&&mAudio.src)mAudio.play().catch(()=>{});else mNext()}};
 ['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,go,true))}
function musicStart(){if(mOn)return;mOn=true;if(!mMuted())mNext()}
function musicStop(){mOn=false;if(mAudio){mAudio.pause();mAudio.removeAttribute('src');mAudio.load()}}
function musicToggle(){
 if(mMuted()){store.del('brace-mute');if(mAudio&&mAudio.src)mAudio.play().catch(()=>mNext());else mNext()}
 else{store.set('brace-mute','1');if(mAudio)mAudio.pause()}
 draw()}
function loadDrawn(c){try{const d=JSON.parse(store.get(dkey(c))||'null');drawn=d&&d.s&&d.f?d:{s:[],f:[],last:''}}catch(e){drawn={s:[],f:[],last:''}}
 const L=drawn.last||'';lastMaybe=!!drawn.lm;
 if(typeof drawn.li==='number')lastI=drawn.li;
 else{lastMaybe=/^Forse in comune: /.test(L);const t=L.replace(/^Forse in comune: /,'');lastI=CARDS.findIndex(x=>x.t===t)}
 fresh=false}
function saveDrawn(){drawn.li=lastI;drawn.lm=lastMaybe;drawn.last=lastI>=0?CARDS[lastI].t:'';store.set(dkey(code),JSON.stringify(drawn))}
if(code)loadDrawn(code);

async function rpc(fn,args){const{data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
const b64=s=>{s=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const pushOk='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function enablePush(){
 const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
 if(await Notification.requestPermission()!=='granted'){err='Notifiche non consentite dal telefono';return draw()}
 const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
 await rpc('brace_save_push',{p_code:code,p_player:pid,p_sub:sub.toJSON()});store.set('brace-push',code);err='';draw()}
const fail=e=>{err='Errore: '+(e.message||e);busy=false;draw()};
const deck=()=>CARDS.map((c,i)=>i).filter(i=>CARDS[i].l<=st.lvl);
// pulsante per cancellare la stanza (per entrambi i giocatori)
const cxBtn='<button class="alt" id="cx">Annulla stanza</button>';

async function create(name,hour,lvl){
 const[a,b]=hour.split(':');const d=new Date();d.setHours(+a,+b,0,0);if(d<=Date.now())d.setDate(d.getDate()+1);
 const c=await rpc('brace_create_room',{p_player:pid,p_name:name,p_ev:d.toISOString(),p_lvl:lvl});
 store.del(dkey(c));enter(c)}
async function join(name,c){
 c=c.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
 const r=await rpc('brace_join_room',{p_code:c,p_player:pid,p_name:name});
 if(r==='notfound'){err='Codice non trovato: controlla di averlo scritto giusto';busy=false;return draw()}
 if(r==='full'){err='Stanza al completo: ci sono già due giocatori';busy=false;return draw()}
 if(r!=='ok'){err='Risposta inattesa dal server';busy=false;return draw()}
 enter(c)}
function enter(c){tab='m';conf={given:[],got:[]};confOk=false;hm=null;code=c;store.set('brace-code',c);err='';busy=false;st=null;shared=null;qi=0;tmp={s:[],f:[]};loadDrawn(c);poll();startTimer()}
function leave(){musicStop();conf={given:[],got:[]};confOk=false;hm=null;clearInterval(timer);store.del('brace-code');code=null;st=null;shared=null;err='';sig='';draw()}
async function cancelRoom(){
 if(!confirm("Annullare la stanza? Verrà cancellata anche per l'altro giocatore."))return;
 try{await rpc('brace_cancel_room',{p_code:code,p_player:pid})}catch(e){return fail(e)}
 store.del(dkey(code));leave()}
function startTimer(){clearInterval(timer);timer=setInterval(poll,3000)}
async function poll(){
 if(!code)return;
 try{
  const s=await rpc('brace_room_state',{p_code:code,p_player:pid});
  if(!s){store.del(dkey(code));err='Stanza non trovata';leave();return}
  if(s.partner&&s.me.fin&&s.partner.fin&&!shared)shared=await rpc('brace_get_shared',{p_code:code,p_player:pid});
  if(s.partner&&s.me.fin&&s.partner.fin){try{const c=await rpc('brace_get_confirms',{p_code:code,p_player:pid});conf={given:(c&&c.given)||[],got:(c&&c.got)||[]};confOk=true}catch(e){confOk=false}}
  const ns=JSON.stringify([s,shared&&1,conf,confOk]);
  st=s;if(ns!==sig||err){sig=ns;err='';draw()}
 }catch(e){err='Connessione instabile…';draw()}}

function draw(){$.innerHTML=view();wire()}
function view(){
 if(!code){
 const intro=`${LOGO}<div class="tag">per due, consensuali, su due telefoni</div><h1>Brace</h1>
<p>Ognuno risponde in segreto sul proprio telefono. Vedrete solo ciò che coincide. Poi la giornata scalda piano, fino alla serata.</p>`;
 const name=`<label>Il tuo nome</label><input type="text" id="nm" maxlength="20" value="${esc(store.get('brace-name')||'')}">`;
 const e=`<p class="note err">${esc(err)}</p>`;
 if(hm==='new')return intro+`<div class="card">${name}
<label>Ora della serata</label><input type="time" id="hr" value="21:00">
<label class="chk"><input type="checkbox" id="lv"> Modalità audace (carte esplicite: attivatela solo se siete entrambi d'accordo)</label>
<p class="note">Solo chi crea la stanza sceglie ora e modalità. L'altro giocatore le vedrà ma non potrà cambiarle.</p>
<button id="mk" ${busy?'disabled':''}>Crea la stanza</button><button class="alt" id="bk">Indietro</button></div>`+e;
 if(hm==='join')return intro+`<div class="card">${name}
<label>Codice della stanza</label><input type="text" id="cd" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" style="text-transform:uppercase">
<p class="note">Ora della serata e modalità le ha scelte chi ha creato la stanza.</p>
<button id="jn" ${busy?'disabled':''}>Entra nella stanza</button><button class="alt" id="bk">Indietro</button></div>`+e;
 return intro+`<div class="card"><button id="gn">Creo una stanza</button><button class="alt" id="gj">Ho un codice</button></div>`+e}
 if(!st)return `<p>Carico la stanza ${esc(code)}…</p><p class="note err">${esc(err)}</p>${cxBtn}<button class="alt" id="lv2">Esci</button>`;
 if(!st.partner)return `<div class="tag">stanza creata</div><h2>Manda questo codice al tuo partner</h2><div class="code">${esc(code)}</div>
<p>Deve aprire questa stessa pagina e inserire il codice.</p>${cxBtn}<button class="alt" id="lv2">Esci</button><p class="note err">${esc(err)}</p>`;
 const d=deck();
 if(!st.me.fin){if(qi>=d.length)return `<p>Salvo le risposte…</p>`;const fxc=fx?' rise':'';fx=false;
  return `<div class="note">Serata alle ${new Date(st.ev).toTimeString().slice(0,5)} · modalità audace ${st.lvl===2?'attiva':'non attiva'} (decisa da chi ha creato la stanza)</div><div class="note">${qi+1} / ${d.length}</div><div class="card qc${fxc}">${ico(d[qi])}<div class="qt">${esc(CARDS[d[qi]].t)}</div></div>
<button data-a="s">Sì</button><button class="alt" data-a="f">Forse</button><button class="alt" data-a="m">Mai</button>
<p class="note">Il tuo «mai» non viene mostrato a nessuno, nemmeno al server dopo il confronto.</p>${cxBtn}<p class="note err">${esc(err)}</p>`}
 if(!st.partner.fin)return `<div class="tag">risposte inviate</div><h2>Aspettiamo ${esc(st.partner.name)}</h2><p>Quando avrà finito, il mazzo comparirà qui in automatico.</p>${cxBtn}<button class="alt" id="lv2">Esci</button><p class="note err">${esc(err)}</p>`;
 return play()}
function play(){
 musicStart();
 const now=Date.now()+skip,ms=MISS.filter(m=>m.l<=st.lvl),P=st.partner.name,ev=st.ev;
 const un=ms.map(m=>ev-m.o*36e5<=now),mine=st.me.done,theirs=st.partner.done;
 const t0=ev-ms[0].o*36e5,tp=Math.max(0,Math.min(1,(now-t0)/(ev-t0)));
 const tension=Math.round((tp*.5+(mine.length+theirs.length)/(ms.length*2)*.5)*100),open=now>=ev;
 const hh=new Date(ev).toTimeString().slice(0,5);
 const head=`<div class="hd"><div><div class="tag">tensione condivisa</div><h2>${tension}%</h2></div><button class="alt sm" id="mu">${mMuted()?'🔇 Musica spenta':'🔊 Musica attiva'}</button></div><div class="bar"><i style="width:${tension}%"></i></div>
<p class="note" style="margin:.2em 0 .6em">Serata alle ${hh}. ${esc(P)} ha completato ${theirs.length} missioni su ${ms.length}.</p>`;
 // --- le tue missioni segrete ---
 let sM=`<div class="card"><div class="tag">le tue missioni segrete</div>`;
 ms.forEach((m,k)=>{const at=new Date(ev-m.o*36e5).toTimeString().slice(0,5);const dn=mine.includes(k);
  const cf=conf.got.includes(k),showBtn=confOk?!cf:!dn,txt=esc(m.t.replace(/\{P\}/g,P));
  sM+=un[k]?`<div class="m"><span>${cf?'✓✓ ':dn?'✓ ':''}${txt}${dn&&!cf&&confOk?`<br><small class="note">⏳ In attesa della conferma di ${esc(P)}</small>`:''}${cf?`<br><small class="note">Confermata da ${esc(P)}</small>`:''}</span>${showBtn?`<button class="sm" ${dn?'disabled':`data-d="${k}"`}>Fatto</button>`:''}</div>`
  :`<div class="m lock">Si sblocca alle ${at}</div>`});
 sM+=`</div>`;
 // --- missioni del partner da confermare ---
 let sC=`<div class="card"><div class="tag">missioni di ${esc(P)} da confermare</div>`;
 if(confOk&&theirs.length){
  theirs.slice().sort((a,b)=>a-b).forEach(k=>{const g=conf.given.includes(k),tx=esc(ms[k].t.replace(/\{P\}/g,(st.me.name||'te')));
   sC+=`<div class="m"><span>${g?'✓ ':''}${tx}</span>${g?'':`<button class="sm" data-c="${k}">Confermo</button>`}</div>`})}
 else sC+=`<div class="m lock">Nessuna missione da confermare per ora.</div>`;
 sC+=`</div>`;
 const pending=confOk?theirs.filter(k=>!conf.given.includes(k)).length:0;
 const allOk=confOk?ms.every((m,k)=>conf.got.includes(k)):ms.every((m,k)=>mine.includes(k)),okN=ms.filter((m,k)=>(confOk?conf.got:mine).includes(k)).length;
 const y=shared?shared.s:[],f=shared?shared.f:[];
 const ts=shared?shared.s.length:0,tf=shared?shared.f.length:0;
 const ds=shared?shared.s.filter(i=>drawn.s.includes(i)).length:0,df=shared?shared.f.filter(i=>drawn.f.includes(i)).length:0;
 // --- la serata ---
 const sS=open?`<div class="card"><div class="tag">la serata</div>${tcard()}
<button id="pk" ${allOk&&ds<ts?'':'disabled'}>Pesca dal mazzo (${ds}/${ts})</button>${tf?`<button class="alt" id="mb" ${allOk&&df<tf?'':'disabled'}>Sblocca un «forse» in comune (${df}/${tf})</button>`:''}${allOk?'':`<p class="note">Per pescare devi completare${confOk?' e far confermare':''} tutte le missioni (${okN}/${ms.length}).</p>`}${ts&&ds>=ts?'<p class="note">Hai pescato tutte le carte del mazzo.</p>':''}${tf&&df>=tf?'<p class="note">Hai sbloccato tutti i «forse» in comune.</p>':''}</div>`
 :`<div class="card"><div class="tag">la serata</div><div class="m lock">Si apre alle ${hh}</div></div>`;
 // --- mazzo in comune ---
 const sD=`<div class="card"><div class="tag">mazzo in comune (${y.length})</div>${y.length?(open?y.map(i=>`<div class="m mini">${ico(i)}<span>${esc(CARDS[i].t)}</span></div>`).join(''):`<div class="m lock">Si apre all'ora della serata</div>`):'<div class="m">Nessuna coincidenza piena: ripensateci con più «forse».</div>'}</div>`;
 // --- menù in alto ---
 const TABS=[['m','Missioni',0],['c','Conferme',pending],['s','Serata',0],['d','Mazzo',0]];
 const nav=`<nav class="tabs">${TABS.map(([k,l,n])=>`<button class="tb${tab===k?' on':''}" data-t="${k}">${l}${n?`<span class="bdg">${n}</span>`:''}</button>`).join('')}</nav>`;
 const body={m:sM,c:sC,s:sS,d:sD}[tab]||sM;
 return head+nav+body+`
 <button class="alt sm" id="sk">Anteprima: avanza di 2 ore (solo su questo telefono)</button> <button class="alt sm" id="lv2">Esci</button>
 ${cxBtn}
 ${pushOk?(store.get('brace-push')===code?'<p class="note">🔔 Notifiche attive su questo telefono.</p>':'<button id="pn">Attiva le notifiche delle missioni</button>'):'<p class="note">Per le notifiche su iPhone: Condividi → «Aggiungi alla schermata Home», poi apri Brace da lì.</p>'}<p class="note err">${esc(err)}</p><p class="note">Brace v${APP_V}</p>`}
function wire(){const q=id=>document.getElementById(id);
 if(fresh&&q('tc')){fresh=false;setTimeout(()=>{const t=q('tc');if(t){t.classList.remove('deal');t.classList.add('open','just')}},520)}
 if(q('mk'))q('mk').onclick=()=>{const n=q('nm').value||'Io',h=q('hr').value||'21:00',l=q('lv').checked?2:1;store.set('brace-name',n);busy=true;draw();create(n,h,l).catch(fail)};
 if(q('jn'))q('jn').onclick=()=>{const n=q('nm').value||'Io',c=q('cd').value;store.set('brace-name',n);busy=true;draw();join(n,c).catch(fail)};
 if(q('lv2'))q('lv2').onclick=leave;
 if(q('cx'))q('cx').onclick=cancelRoom;
 if(q('nm'))q('nm').oninput=()=>store.set('brace-name',q('nm').value);
 if(q('gn'))q('gn').onclick=()=>{hm='new';draw()};
 if(q('gj'))q('gj').onclick=()=>{hm='join';draw()};
 if(q('bk'))q('bk').onclick=()=>{hm=null;err='';draw()};
 if(q('pn'))q('pn').onclick=()=>enablePush().catch(fail);
 $.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=deck()[qi];if(b.dataset.a!=='m')tmp[b.dataset.a].push(i);qi++;fx=true;
  if(qi>=deck().length){draw();rpc('brace_submit_answers',{p_code:code,p_player:pid,p_s:tmp.s,p_f:tmp.f}).then(poll).catch(fail)}else draw()});
 $.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=+b.dataset.d;st.me.done=[...st.me.done,k];draw();rpc('brace_mark_done',{p_code:code,p_player:pid,p_k:k}).catch(fail)});
 if(q('mu'))q('mu').onclick=musicToggle;
 $.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();window.scrollTo(0,0)});
 $.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=+b.dataset.c;conf.given=[...conf.given,k];draw();rpc('brace_confirm',{p_code:code,p_player:pid,p_k:k}).catch(fail)});
 if(q('sk'))q('sk').onclick=()=>{skip+=72e5;draw()};
 if(q('pk'))q('pk').onclick=()=>{const r=shared.s.filter(i=>!drawn.s.includes(i));if(!r.length)return;
  const i=r[Math.floor(Math.random()*r.length)];drawn.s.push(i);lastI=i;lastMaybe=false;fresh=true;saveDrawn();draw()};
 if(q('mb'))q('mb').onclick=()=>{const r=shared.f.filter(i=>!drawn.f.includes(i));if(!r.length)return;
  const i=r[Math.floor(Math.random()*r.length)];drawn.f.push(i);lastI=i;lastMaybe=true;fresh=true;saveDrawn();draw()}}
draw();
if(code){poll();startTimer()}
setInterval(()=>{if(st&&st.partner&&st.me.fin&&st.partner.fin)draw()},60000);
</script>
</body>
</html>
